[package]
name = "leptos-capital-markers"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Capital city markers for leptos-leaflet-wyatt — renders weather-aware markers on a Leaflet map"
repository = "https://github.com/WyattAu/leptos-capital-markers"
keywords = ["leptos", "leaflet", "map", "markers", "capitals"]
categories = ["wasm", "gui", "web-programming"]
exclude = ["/target"]

[dependencies]
leptos = { version = "0.8", default-features = false }
leptos-leaflet-wyatt = { version = "0.1", path = "/home/wyatt/dev/src/github.com/WyattAu/leptos-leaflet" }
web-sys = { version = "0.3", features = [
    "HtmlElement", "Element",
] }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = { version = "0.6", features = ["http"] }

[features]
hydrate = ["leptos/hydrate", "leptos-leaflet-wyatt/hydrate"]
ssr = ["leptos/ssr", "leptos-leaflet-wyatt/ssr"]
default = ["hydrate"]

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
