# WyattAu dependency governance — cargo-deny configuration.
# Copy to the repo root. Policies: see engineering-standards README §7.

[graph]
all-features = true

[advisories]
# Dev/runtime chain unmaintained advisories — same as the fleet's other
# leptos/tier-c kits (precedent: webauthn-kit, salting).
ignore = [
    # paste — unmaintained; pulled via leptos 0.8 proc-macro stack. No
    # in-graph fix (pastey is the fork leptos hasn't migrated to).
    "RUSTSEC-2024-0436",
    # proc-macro-error2 — unmaintained; via leptos 0.8 macro deps.
    "RUSTSEC-2026-0173",
]

version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
  # BSL-1.0 — permissive Boost license; ships via redis >=1.0's bundled xxhash
  # (precedent: webhookkit).
  "BSL-1.0",
  # MPL-2.0 — weak file-level copyleft, linkable; cssparser/html5ever via
  # ammonia (precedent: docs-pipeline).
  "MPL-2.0",
  # CC0-1.0 — public-domain dedication; notify dependency chain
  # (precedent: config-kit).
  "CC0-1.0",
  # 0BSD — public-domain-equative, no attribution requirement beyond the
  # notice; quoted_printable via lettre (precedent: mailkit).
  "0BSD",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
